---
# El live de casper monta la ISO en /cdrom. unpackfs copia ese squashfs al
# rootfs destino antes de configurar usuarios y bootloader. Ubuntu 26.04
# publica el rootfs como minimal.standard.squashfs; remaster.sh reescribe este
# source al nombre detectado si la ISO de entrada usa filesystem.squashfs.
unpack:
  - source: "/cdrom/casper/minimal.standard.squashfs"
    sourcefs: "squashfs"
    destination: ""
    weight: 1
