---
# Un usuario administrador con sudo; root no recibe contrasena y no se
# permite login grafico de root.
userGroup: users
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false
doAutoLogin: false
allowRootLogin: false
defaultGroups:
  - users
  - sudo
  - audio
  - video
  - render
  - network
  - lp
  - plugdev
