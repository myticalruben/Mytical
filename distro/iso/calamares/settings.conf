---
# Configuracion minima de Calamares para Mytical V1.1.
#
# NO es una instalacion funcional todavia: faltan los .conf de cada modulo
# (unpackfs, partition, bootloader, users, etc.) y los hooks de post-instalacion.
# Ver docs/distro/ISO.md, bloqueante B1.
#
# La marca vive en /usr/share/calamares/branding/mytical/ y se copia desde
# distro/iso/calamares/branding/mytical/ durante el remaster.

modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - id: welcome
    module: welcome
    config: welcome.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services
      - grubcfg
      - bootloader
      - umount
      - finished

branding: mytical
prompt-install: true
dont-chroot: false
oem-setup: false
