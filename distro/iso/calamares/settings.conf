---
# Configuracion de Calamares para Mytical V1.1.
#
# Los modulos con .conf propio viven en calamares/modules/ y se copian a
# /etc/calamares/modules durante el remaster. La secuencia instala el rootfs
# casper en disco, crea el usuario, fija SDDM como display manager y conserva
# el arranque firmado de Ubuntu.
#
# La marca vive en /usr/share/calamares/branding/mytical/ y se copia desde
# distro/iso/calamares/branding/mytical/ durante el remaster.

modules-search:
  - local
  - /usr/lib/calamares/modules

instances:
  - id: welcome
    module: welcome
    config: welcome.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services
      - grubcfg
      - bootloader
      - umount
      - finished

branding: mytical
prompt-install: true
dont-chroot: false
oem-setup: false
